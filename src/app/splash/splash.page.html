
<ion-content [fullscreen]="true">
  <ion-content class="ion-no-padding">
    <div class="splash-container">
      <!-- Logo animé -->
      <div class="logo-box">
        <svg class="dumbbell" viewBox="0 0 100 100">
          <circle class="weight left" cx="20" cy="50" r="15"/>
          <rect class="bar" x="15" y="45" width="70" height="10" rx="5"/>
          <circle class="weight right" cx="80" cy="50" r="15"/>
        </svg>
      </div>
      
      <!-- Texte animé -->
      <div class="text-container">
        <h1 class="title">SpOrTiFy OnLiNe</h1>
        <div class="loading-text">
          <span>L</span>
          <span>O</span>
          <span>A</span>
          <span>D</span>
          <span>I</span>
          <span>N</span>
          <span>G</span>
        </div>
      </div>
    </div>
  </ion-content>r>
  
</ion-content>
